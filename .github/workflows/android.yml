# Bilgisayarda kurulum yapmadan APK almak için:
# Projeyi GitHub'a yükleyin → Actions sekmesi → "Android APK" → Run workflow
# Bitince "Artifacts" bölümünden AuroraMediaPlayer-apk dosyasını indirin.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'

      - name: MAUI Android iş yükü
        run: dotnet workload install maui-android

      - name: APK derle
        shell: bash
        run: |
          set -o pipefail
          dotnet publish AuroraMediaPlayer.csproj -f net10.0-android -c Release -p:AuroraTarget=android \
            -p:AndroidPackageFormats=apk -o cikti 2>&1 | tee build.log || {
            grep -E "error|Error|ERROR" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: AuroraMediaPlayer-apk
          path: cikti/*-Signed.apk

      # main'e her gönderimde: .csproj'deki sürüm (ApplicationDisplayVersion) henüz yayınlanmadıysa
      # GitHub "Releases" sayfasında APK ile yeni sürüm oluştur. Yeni sürüm için numarayı artırmanız yeterli.
      - name: Sürümü yayınla
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v$(grep -oP '(?<=<ApplicationDisplayVersion>)[^<]+' AuroraMediaPlayer.csproj)"
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "$VER zaten yayınlanmış, atlanıyor."; exit 0
          fi
          cp cikti/*-Signed.apk "AuroraMediaPlayer-$VER.apk"
          gh release create "$VER" "AuroraMediaPlayer-$VER.apk" --target "$GITHUB_SHA" \
            --title "TROÇKİ® AURORA MEDIA PLAYER $VER" \
            --notes "Sen İzle, Dünya Güzelleşsin…

          **Android kurulumu:** APK dosyasını telefona indirip açın. İlk kez kuruyorsanız 'Bilinmeyen kaynaklardan yükleme' iznini verin.

          - Videolar, Müzikler, Klasörler, Favoriler, Son Oynatılanlar
          - Kaldığı yerden devam, karıştır/tekrar, hız, tam ekran, arka planda çalma
          - Android 8.0 ve üzeri

          © TROÇKİ® Software — Düşün • Keşfet • Üret • Paylaş"
