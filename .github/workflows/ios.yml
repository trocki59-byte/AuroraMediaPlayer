# iPhone sürümü — Mac'iniz olmadan GitHub'ın Mac bilgisayarlarında derlenir.
#
# 1) Her çalıştırmada "derleme kontrolü" yapılır (imzasız, simülatör için) → kod hatası var mı görülür.
# 2) İmzalı .ipa (iPhone'a kurulum / TestFlight / App Store) için Apple Developer hesabı gerekir.
#    GitHub › Settings › Secrets and variables › Actions bölümüne şu gizli değerleri ekleyin:
#      IOS_P12_BASE64          Apple Distribution sertifikası (.p12) — base64
#      IOS_P12_PASSWORD        .p12 şifresi
#      IOS_PROFILE_BASE64      Provisioning profile (.mobileprovision) — base64
#      IOS_CODESIGN_KEY        Sertifika adı, ör: "Apple Distribution: Sabahattin ... (TEAMID)"
#      IOS_PROFILE_NAME        Provisioning profile adı
#    Bu değerler varsa .ipa da üretilir ve Artifacts bölümünden indirilebilir.
name: iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - name: Kurulu Xcode sürümleri
        run: ls /Applications | grep -i xcode || true

      - name: En güncel Xcode (.NET iOS paketinin istediği SDK için)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: MAUI iOS iş yükü
        run: dotnet workload install maui-ios

      - name: Xcode ve .NET sürümleri
        run: |
          xcodebuild -version
          echo "::notice::$(xcodebuild -version | head -1) / iOS iş yükü: $(dotnet workload list | grep -i ios | head -1)"
          dotnet --info | head -30
          dotnet workload list

      - name: Derleme kontrolü (simülatör, imzasız)
        shell: bash
        run: |
          set -o pipefail
          dotnet build AuroraMediaPlayer.csproj -f net10.0-ios -c Debug -p:AuroraTarget=ios \
            -p:RuntimeIdentifier=iossimulator-arm64 -p:ValidateXcodeVersion=false -p:MtouchLink=SdkOnly 2>&1 | tee build.log || {
            # Hata satırlarını GitHub özetine taşı (log indirmeden görülebilsin)
            grep -E "error|Error|ERROR" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      # Apple Developer hesabı olmadan: imzasız .ipa üret → Windows'ta Sideloadly ile
      # kendi (ücretsiz) Apple ID'nizle imzalayıp iPhone'a kurun.
      - name: İmzasız .ipa (Sideloadly için)
        if: env.IOS_P12_BASE64 == ''
        shell: bash
        run: |
          set -o pipefail
          dotnet publish AuroraMediaPlayer.csproj -f net10.0-ios -c Release -p:AuroraTarget=ios \
            -p:RuntimeIdentifier=ios-arm64 -p:EnableCodeSigning=false -p:BuildIpa=true \
            -p:ValidateXcodeVersion=false -p:MtouchLink=SdkOnly -o cikti_ios 2>&1 | tee ipa.log || {
            grep -E "error|Error" ipa.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          ls -la cikti_ios

      - name: .ipa'yı GitHub sürümüne ekle
        if: env.IOS_P12_BASE64 == '' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v$(grep -oE '<ApplicationDisplayVersion>[^<]+' AuroraMediaPlayer.csproj | sed 's/.*>//')"
          IPA=$(ls cikti_ios/*.ipa | head -1)
          cp "$IPA" "AuroraMediaPlayer-$VER-iphone-imzasiz.ipa"
          # Android iş akışı sürümü oluşturana kadar bekle (en fazla 20 dk)
          for i in $(seq 1 40); do gh release view "$VER" >/dev/null 2>&1 && break; sleep 30; done
          gh release view "$VER" >/dev/null 2>&1 || gh release create "$VER" --target "$GITHUB_SHA" --title "TROÇKİ® AURORA MEDIA PLAYER $VER" --notes "Sen İzle, Dünya Güzelleşsin…"
          gh release upload "$VER" "AuroraMediaPlayer-$VER-iphone-imzasiz.ipa" --clobber

      - name: Sertifika ve profili yükle
        if: env.IOS_P12_BASE64 != ''
        env:
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/aurora.keychain-db
          KPASS=$(uuidgen)
          echo "$IOS_P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KPASS" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "$KPASS" $KEYCHAIN
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN
          security set-key-partition-list -S apple-tool:,apple: -k "$KPASS" $KEYCHAIN
          security list-keychain -d user -s $KEYCHAIN
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/aurora.mobileprovision

      - name: İmzalı .ipa üret
        if: env.IOS_P12_BASE64 != ''
        run: >
          dotnet publish AuroraMediaPlayer.csproj -f net10.0-ios -c Release -p:AuroraTarget=ios
          -p:CodesignKey="${{ secrets.IOS_CODESIGN_KEY }}"
          -p:CodesignProvision="${{ secrets.IOS_PROFILE_NAME }}"
          -o cikti_ios

      - uses: actions/upload-artifact@v4
        if: env.IOS_P12_BASE64 != ''
        with:
          name: AuroraMediaPlayer-ipa
          path: cikti_ios/*.ipa
