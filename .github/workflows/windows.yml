# Aurora Media Player — Windows masaüstü programı (.NET 10 + WebView2)
# Derleme kontrolü ve tek dosya exe. Exe kendi kendine güncellenmez; içine gömülü sürümle çalışır.
name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "desktop-net/**", ".github/workflows/windows.yml" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Web arayüzünü son sürümle eşitle
        shell: bash
        run: cp docs/index.html docs/manifest.webmanifest docs/icon-*.png desktop-net/web/

      - name: EXE derle
        shell: bash
        run: |
          set -o pipefail
          dotnet publish desktop-net/AuroraDesktop.csproj -c Release -o cikti 2>&1 | tee build.log || {
            grep -E "error" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          ls -la cikti

      - uses: actions/upload-artifact@v4
        with:
          name: AuroraMediaPlayer-windows
          path: cikti/AuroraMediaPlayer.exe

      - name: GitHub sürümünde yayınla
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="windows-v$(grep -oE '<Version>[^<]+' desktop-net/AuroraDesktop.csproj | sed 's/.*>//')"
          if ! gh release view "$VER" >/dev/null 2>&1; then
            gh release create "$VER" --target "$GITHUB_SHA" --title "TROÇKİ® AURORA MEDIA PLAYER — Windows ${VER#windows-v}" \
              --notes "Sen İzle, Dünya Güzelleşsin… — .NET 10 masaüstü programı. Bilgisayarda .NET 10 Masaüstü Çalışma Zamanı gerekir."
          fi
          # Eski Electron dosyalarını kaldır, .NET exe'yi yükle
          for a in $(gh release view "$VER" --json assets -q '.assets[].name'); do
            case "$a" in AuroraMediaPlayer-Kurulum-*|AuroraMediaPlayer-Tasinabilir-*) gh release delete-asset "$VER" "$a" --yes ;; esac
          done
          gh release upload "$VER" cikti/AuroraMediaPlayer.exe --clobber
